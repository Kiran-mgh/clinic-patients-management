version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: amar-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-amar_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePasswordChangeMe!}
      POSTGRES_DB: ${DB_DATABASE:-amar_hospital}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amar-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: amar-portal
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
