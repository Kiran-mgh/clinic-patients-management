version: '3.8'

services:
  staging-postgres:
    image: postgres:15-alpine
    container_name: staging-amar-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5433"
    volumes:
      - /home/ubuntu/staging-postgres-data:/var/lib/postgresql/data
    restart: always

  staging-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staging-amar-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - staging-postgres
    restart: always
